<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>요일조합 항공권 탐색기</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e1117">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="항공권탐색기">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e1117;
    --panel: #171b24;
    --panel-2: #1f2430;
    --border: #2a2f3d;
    --text: #e8e6df;
    --text-dim: #8b8f9c;
    --amber: #f5a623;
    --amber-dim: #3a2c10;
    --green: #3ddc84;
    --green-dim: #123322;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh; padding:24px 16px 60px;
  }
  .wrap{ max-width:480px; margin:0 auto; }
  header{ margin-bottom:20px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--amber); letter-spacing:1px; }
  h1{ font-size:22px; font-weight:600; margin:6px 0 0; }
  .sub{ color:var(--text-dim); font-size:14px; margin-top:8px; line-height:1.6; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .row:last-child{ margin-bottom:0; }
  label.field-label{ font-size:13px; color:var(--text-dim); min-width:64px; flex-shrink:0; }

  select, input[type=text]{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:9px 10px; font-size:14px; font-family:inherit; flex:1; width:100%;
  }
  .dow-group{ display:flex; gap:4px; flex:1; }
  .dow-btn{
    flex:1; padding:8px 0; text-align:center; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text-dim); border-radius:6px; font-size:13px; font-family:'JetBrains Mono', monospace;
    cursor:pointer; user-select:none;
  }
  .dow-btn.on{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); font-weight:700; }
  .nights-note{ font-size:12px; color:var(--text-dim); text-align:right; margin-top:8px; }

  input[type=range]{ flex:1; accent-color:var(--amber); }
  .weeks-val{ font-family:'JetBrains Mono', monospace; font-size:13px; min-width:40px; text-align:right; }

  .gen-btn{
    width:100%; padding:13px; background:var(--amber); color:#1a1204; border:none; border-radius:8px;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px;
  }
  .gen-btn:active{ transform:scale(0.98); }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11px; color:var(--text-dim); font-weight:400; padding:6px 4px; border-bottom:1px solid var(--border); }
  td{ padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  .date-cell{ font-family:'JetBrains Mono', monospace; }
  .open-link{ color:var(--amber); text-decoration:none; font-family:'JetBrains Mono', monospace; font-size:12px; }
  .price-cell{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text-dim); }
  .price-cell.ok{ color:var(--text); font-weight:700; }
  .price-cell.fail{ color:var(--text-dim); }
  .retry-link{ color:var(--amber); text-decoration:none; font-size:11px; margin-left:6px; }
  tr.cheapest td{ background:var(--green-dim); }
  tr.cheapest .price-cell{ color:var(--green); }
  .progress-note{ font-size:12px; color:var(--text-dim); margin-top:10px; text-align:center; }

  .tab-bar{ display:flex; gap:6px; margin-bottom:14px; }
  .tab-btn{
    flex:1; padding:11px 0; text-align:center; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; color:var(--text-dim); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .tab-btn.active{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .dest-info-title{ font-size:15px; font-weight:600; margin-bottom:14px; }
  .dest-info-links{ display:flex; flex-direction:column; gap:8px; }
  .info-link{
    display:flex; align-items:center; gap:10px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:8px; padding:11px 12px; text-decoration:none; color:var(--text); font-size:14px;
  }
  .info-link:active{ transform:scale(0.99); }
  .info-icon{ font-size:16px; }
  .dest-info-note{ font-size:11px; color:var(--text-dim); margin-top:14px; line-height:1.5; }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:14px; }
  .month-nav-btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    width:32px; height:32px; border-radius:8px; font-size:16px; cursor:pointer; font-family:inherit;
  }
  .month-label{ font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700; min-width:44px; text-align:center; }

  .seasonal-festival{
    font-size:13px; line-height:1.6; color:var(--text); background:var(--panel-2);
    border-radius:8px; padding:11px 12px; margin-bottom:12px;
  }
  .seasonal-festival-label{ font-size:11px; color:var(--amber); font-weight:700; margin-bottom:4px; display:block; }
  .food-section-label{ font-size:11px; color:var(--text-dim); margin-bottom:8px; }
  .food-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .food-tag{ font-size:12px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:5px 10px; border-radius:999px; }
  .no-data-note{ font-size:13px; color:var(--text-dim); text-align:center; padding:14px 0 18px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">ICN DEPARTURES</div>
    <h1>즉흥여행 탐색기</h1>
    <p class="sub">항공권 최저가 자동조회와 여행지 정보(숙소·맛집·놀거리·시즌 추천)를 한 곳에서 확인하세요.</p>
  </header>

  <div class="card">
    <div class="row">
      <label class="field-label">목적지</label>
      <select id="destSelect">
        <optgroup label="일본">
          <option value="NRT">도쿄(나리타) NRT</option>
          <option value="KIX">오사카 KIX</option>
          <option value="FUK">후쿠오카 FUK</option>
          <option value="CTS">삿포로 CTS</option>
          <option value="NGO">나고야 NGO</option>
          <option value="OKA">오키나와 OKA</option>
        </optgroup>
        <optgroup label="중국">
          <option value="PEK">베이징 PEK</option>
          <option value="PVG">상하이 PVG</option>
          <option value="TAO">칭다오 TAO</option>
          <option value="CAN">광저우 CAN</option>
          <option value="CTU">청두 CTU</option>
          <option value="XIY">시안 XIY</option>
        </optgroup>
        <optgroup label="대만">
          <option value="TPE">타이베이 TPE</option>
          <option value="KHH">가오슝 KHH</option>
        </optgroup>
        <optgroup label="베트남">
          <option value="DAD">다낭 DAD</option>
          <option value="HAN">하노이 HAN</option>
          <option value="SGN">호치민 SGN</option>
          <option value="CXR">나트랑 CXR</option>
          <option value="PQC">푸꾸옥 PQC</option>
        </optgroup>
        <optgroup label="기타 인기">
          <option value="BKK">방콕 BKK</option>
          <option value="CEB">세부 CEB</option>
          <option value="GUM">괌 GUM</option>
        </optgroup>
        <option value="__custom">직접 입력...</option>
      </select>
    </div>
    <div class="row" id="customDestRow" style="display:none;">
      <label class="field-label">공항코드</label>
      <input type="text" id="customDest" maxlength="3" placeholder="예: NRT">
    </div>
  </div>

  <div class="tab-bar">
    <button type="button" class="tab-btn active" id="tabBtnFlight" data-tab="flight">✈️ 항공권 탐색</button>
    <button type="button" class="tab-btn" id="tabBtnInfo" data-tab="info">🗺️ 여행지 정보</button>
  </div>

  <div class="tab-panel active" id="tabFlight">
    <div class="card">
      <div class="row">
        <label class="field-label">출발요일</label>
        <div class="dow-group" id="depGroup"></div>
      </div>
      <div class="row">
        <label class="field-label">복귀요일</label>
        <div class="dow-group" id="retGroup"></div>
      </div>
      <div class="nights-note" id="nightsNote"></div>

      <div class="row" style="margin-top:14px;">
        <label class="field-label">탐색범위</label>
        <input type="range" id="weeksRange" min="4" max="16" value="8" step="1">
        <span class="weeks-val" id="weeksVal">8주</span>
      </div>

      <button class="gen-btn" id="genBtn">링크 생성</button>
    </div>

    <div class="card" id="resultsCard" style="display:none;">
      <table>
        <thead>
          <tr><th>기간</th><th style="width:48px;"></th><th style="width:108px;">최저가</th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <div class="progress-note" id="progressNote"></div>
    </div>
  </div>

  <div class="tab-panel" id="tabInfo">
    <div class="card">
      <div class="dest-info-title" id="destInfoTitle">여행지 정보</div>

      <div class="month-nav">
        <button type="button" class="month-nav-btn" id="prevMonthBtn">‹</button>
        <span class="month-label" id="monthLabel">9월</span>
        <button type="button" class="month-nav-btn" id="nextMonthBtn">›</button>
      </div>
      <div id="seasonalBody"></div>

      <div class="dest-info-links">
        <a class="info-link" id="lodgingLink" target="_blank" rel="noopener">
          <span class="info-icon">🏠</span><span>숙소 찾아보기</span>
        </a>
        <a class="info-link" id="foodLink" target="_blank" rel="noopener">
          <span class="info-icon">🍜</span><span>맛집 찾아보기</span>
        </a>
        <a class="info-link" id="activityLink" target="_blank" rel="noopener">
          <span class="info-icon">🎡</span><span>놀거리 찾아보기</span>
        </a>
      </div>
      <div class="dest-info-note">예매 전에도 자유롭게 둘러볼 수 있어요. 축제/제철음식은 매년 조금씩 달라질 수 있으니 정확한 일정은 방문 전 다시 확인해주세요.</div>
    </div>
  </div>
</div>

  PEK: '베이징', PVG: '상하이', TAO: '칭다오', CAN: '광저우', CTU: '청두', XIY: '시안',

  TPE: {
    1:{festival:'선선한 날씨, 여행 좋은 시기', food:['훠궈']},
    2:{festival:'춘절(음력설) - 상점 휴무 많을 수 있음', food:['명절 음식']},
    3:{festival:'벚꽃 시즌 시작(양명산)', food:['딸기']},
    4:{festival:'벚꽃·봄꽃 절정', food:['죽순']},
    5:{festival:'더워지기 시작', food:['망고 시즌 시작']},
    6:{festival:'단오절(용선 축제)', food:['쫑즈(찹쌀 만두)']},
    7:{festival:'무더위, 망고빙수 시즌', food:['망고빙수']},
    8:{festival:'유령절(중원절) 전통행사', food:['열대과일']},
    9:{festival:'중추절(월병·바베큐 문화)', food:['월병']},
    10:{festival:'선선해지는 초가을', food:['훠궈 다시 인기']},
    11:{festival:'양명산 억새 시즌', food:['우육면']},
    12:{festival:'크리스마스 분위기, 온천 여행 시즌', food:['훠궈','온천 두부']}
  }
};

var state = {
  dest: 'KIX',
  customDest: '',
  depDow: 5,
  retDow: 0,
  weeks: 8
};

var viewMonth = new Date().getMonth() + 1;

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function buildDowGroup(container, selectedDow, onSelect){
  container.innerHTML = '';
  DOW.forEach(function(label, i){
    var btn = document.createElement('div');
    btn.className = 'dow-btn' + (i === selectedDow ? ' on' : '');
    btn.textContent = label;
    btn.addEventListener('click', function(){ onSelect(i); });
    container.appendChild(btn);
  });
}

function renderDowGroups(){
  buildDowGroup(document.getElementById('depGroup'), state.depDow, function(i){
    state.depDow = i; saveState(); renderDowGroups();
  });
  buildDowGroup(document.getElementById('retGroup'), state.retDow, function(i){
    state.retDow = i; saveState(); renderDowGroups();
  });
  var nights = (state.retDow - state.depDow + 7) % 7;
  var note = nights === 0 ? '당일치기 일정이에요' : (nights + '박 ' + (nights + 1) + '일 일정이에요');
  document.getElementById('nightsNote').textContent = note;
}

function currentDest(){
  return state.dest === '__custom' ? (state.customDest || '').toUpperCase() : state.dest;
}

function renderDestInfo(){
  var code = currentDest();
  var city = DEST_INFO[code] || code || '여행지';
  document.getElementById('destInfoTitle').textContent = city + ' 여행 정보';

  if (!code || code.length !== 3){
    document.getElementById('lodgingLink').href = '#';
    document.getElementById('foodLink').href = '#';
    document.getElementById('activityLink').href = '#';
    return;
  }
  var q = encodeURIComponent(city);
  document.getElementById('lodgingLink').href = 'https://www.airbnb.co.kr/s/' + q + '/homes';
  document.getElementById('foodLink').href = 'https://www.google.com/maps/search/?api=1&query=' + q + '+맛집';
  document.getElementById('activityLink').href = 'https://www.google.com/maps/search/?api=1&query=' + q + '+가볼만한곳';
}

function renderSeasonalInfo(){
  document.getElementById('monthLabel').textContent = viewMonth + '월';
  var code = currentDest();
  var body = document.getElementById('seasonalBody');
  var data = SEASONAL_INFO[code];

  if (!data){
    body.innerHTML = '<div class="no-data-note">이 목적지는 아직 시즌 정보가 준비되지 않았어요.<br>필요하면 말씀해주세요, 추가해드릴게요.</div>';
    return;
  }
  var entry = data[viewMonth];
  var foodTags = entry.food.map(function(f){ return '<span class="food-tag">' + f + '</span>'; }).join('');
  body.innerHTML =
    '<div class="seasonal-festival"><span class="seasonal-festival-label">이맘때 볼거리</span>' + entry.festival + '</div>' +
    '<div class="food-section-label">제철 음식</div>' +
    '<div class="food-tags">' + foodTags + '</div>';
}

function fmtShort(d){ return (d.getMonth()+1) + '/' + d.getDate() + '(' + DOW[d.getDay()] + ')'; }
function ymd(d){
  var mm = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2);
  return '' + d.getFullYear() + mm + dd;
}
function nextDow(base, dow){
  var d = new Date(base);
  var diff = (dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function sleep(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

function generate(){
  var dest = currentDest();
  if (!dest || dest.length !== 3){
    alert('목적지 공항코드 3자리를 확인해주세요 (예: NRT)');
    return;
  }
  var nights = (state.retDow - state.depDow + 7) % 7;
  var today = new Date();
  var firstDep = nextDow(today, state.depDow);
  var body = document.getElementById('resultsBody');
  body.innerHTML = '';

  for (var i = 0; i < state.weeks; i++){
    var dep = new Date(firstDep); dep.setDate(dep.getDate() + i*7);
    var ret = new Date(dep); ret.setDate(ret.getDate() + nights);
    var depYmd = ymd(dep), retYmd = ymd(ret);
    var url = 'https://flight.naver.com/flights/international/ICN-' + dest + '-' + depYmd + '/' + dest + '-ICN-' + retYmd + '?adult=1&fareType=Y';

    var tr = document.createElement('tr');
    tr.dataset.dep = depYmd; tr.dataset.ret = retYmd; tr.dataset.dest = dest;

    var tdDate = document.createElement('td');
    tdDate.className = 'date-cell';
    tdDate.textContent = fmtShort(dep) + ' ~ ' + fmtShort(ret);

    var tdLink = document.createElement('td');
    var a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.className = 'open-link'; a.textContent = '열기';
    tdLink.appendChild(a);

    var tdPrice = document.createElement('td');
    var span = document.createElement('span');
    span.className = 'price-cell';
    span.textContent = '대기중';
    tdPrice.appendChild(span);

    tr.appendChild(tdDate); tr.appendChild(tdLink); tr.appendChild(tdPrice);
    body.appendChild(tr);
  }
  document.getElementById('resultsCard').style.display = 'block';
  fetchAllPrices();
}

async function fetchOneRow(tr){
  var cell = tr.querySelector('.price-cell');
  cell.className = 'price-cell';
  cell.textContent = '조회중…';
  delete cell.dataset.price;
  try{
    var url = '/api/search?dep=ICN&dest=' + tr.dataset.dest + '&depDate=' + tr.dataset.dep + '&retDate=' + tr.dataset.ret;
    var resp = await fetch(url);
    var data = await resp.json();
    if (data && typeof data.price === 'number'){
      cell.textContent = data.price.toLocaleString() + '원';
      cell.classList.add('ok');
      cell.dataset.price = data.price;
    } else {
      cell.textContent = '확인 실패';
      cell.classList.add('fail');
      var retry = document.createElement('a');
      retry.href = '#'; retry.className = 'retry-link'; retry.textContent = '재조회';
      retry.addEventListener('click', function(e){ e.preventDefault(); fetchOneRow(tr); });
      cell.appendChild(retry);
    }
  }catch(e){
    cell.textContent = '오류';
    cell.classList.add('fail');
  }
  highlightCheapest();
}

async function fetchAllPrices(){
  var rows = Array.prototype.slice.call(document.querySelectorAll('#resultsBody tr'));
  var note = document.getElementById('progressNote');
  for (var i = 0; i < rows.length; i++){
    note.textContent = '가격 조회 중… (' + (i+1) + '/' + rows.length + ')';
    await fetchOneRow(rows[i]);
    if (i < rows.length - 1) await sleep(500);
  }
  note.textContent = '조회 완료';
}

function highlightCheapest(){
  var rows = Array.prototype.slice.call(document.querySelectorAll('#resultsBody tr'));
  var min = Infinity;
  rows.forEach(function(tr){
    var v = parseFloat(tr.querySelector('.price-cell').dataset.price);
    if (!isNaN(v) && v < min) min = v;
  });
  rows.forEach(function(tr){
    var v = parseFloat(tr.querySelector('.price-cell').dataset.price);
    tr.classList.toggle('cheapest', !isNaN(v) && v === min);
  });
}

function switchTab(name){
  var isFlight = name === 'flight';
  document.getElementById('tabFlight').classList.toggle('active', isFlight);
  document.getElementById('tabInfo').classList.toggle('active', !isFlight);
  document.getElementById('tabBtnFlight').classList.toggle('active', isFlight);
  document.getElementById('tabBtnInfo').classList.toggle('active', !isFlight);
}
document.getElementById('tabBtnFlight').addEventListener('click', function(){ switchTab('flight'); });
document.getElementById('tabBtnInfo').addEventListener('click', function(){ switchTab('info'); });

document.getElementById('destSelect').addEventListener('change', function(){
  state.dest = this.value;
  document.getElementById('customDestRow').style.display = (state.dest === '__custom') ? 'flex' : 'none';
  saveState();
  renderDestInfo();
  renderSeasonalInfo();
});
document.getElementById('customDest').addEventListener('input', function(){
  state.customDest = this.value.toUpperCase();
  saveState();
  renderDestInfo();
  renderSeasonalInfo();
});
document.getElementById('weeksRange').addEventListener('input', function(){
  state.weeks = parseInt(this.value, 10);
  document.getElementById('weeksVal').textContent = state.weeks + '주';
  saveState();
});
document.getElementById('genBtn').addEventListener('click', generate);

document.getElementById('prevMonthBtn').addEventListener('click', function(){
  viewMonth = viewMonth - 1; if (viewMonth < 1) viewMonth = 12;
  renderSeasonalInfo();
});
document.getElementById('nextMonthBtn').addEventListener('click', function(){
  viewMonth = viewMonth + 1; if (viewMonth > 12) viewMonth = 1;
  renderSeasonalInfo();
});

loadState();
document.getElementById('destSelect').value = state.dest;
document.getElementById('customDest').value = state.customDest;
document.getElementById('customDestRow').style.display = (state.dest === '__custom') ? 'flex' : 'none';
document.getElementById('weeksRange').value = state.weeks;
document.getElementById('weeksVal').textContent = state.weeks + '주';
renderDowGroups();
renderDestInfo();
renderSeasonalInfo();

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(e){ console.log('SW 등록 실패', e); });
  });
}
</script>
</body>
</html>
